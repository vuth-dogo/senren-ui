name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the versions the gemspec actually claims: required_ruby_version
  # >= 3.2 and rails >= 7.1. Before this matrix existed, CI tested exactly one
  # combination, so both claims were advertised and never exercised.
  matrix:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest

    strategy:
      # Report every broken combination in one run, not just the first.
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["7.1", "7.2", "8.0", "8.1"]

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Unit tests only. The browser, lint, and audit gates are version
      # independent and run once in the `checks` job rather than 12 times.
      - name: Run test suite
        run: bundle exec rake test

      # Renders all 62 components through the dummy app. Rendering is the
      # part that depends on the Rails version, so it belongs in the matrix.
      - name: Run integration tests
        run: bundle exec rake test:integration

  checks:
    name: Browser, lint, and audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run system tests
        run: bin/system

      - name: Run performance checks
        run: bin/performance

      - name: Run RuboCop
        run: bundle exec rubocop

      # ERB is what 62 of the 64 components are written in, and was the one
      # layer no linter covered.
      - name: Lint ERB templates
        run: bundle exec erb_lint --lint-all

      # Dependabot opens PRs but cannot fail a build. This gate does.
      - name: Audit dependencies for known CVEs
        run: bundle exec bundle-audit check --update

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run controller checks
        run: bun run controllers:check

      # Herb lints the markup. It lives in this job rather than the Ruby one
      # because it ships as an npm package, and the version is pinned in
      # .herb.yml so a new release cannot enable rules under an unrelated PR.
      - name: Lint HTML in templates
        run: bun run templates:lint
