# Senren UI - Vietnamese strings (Tiếng Việt).
#
# Written by hand, in the register of a Vietnamese product or support team:
# short and plain, with the words people already say in English ("email", "slide",
# "tab") left as they are. The keys and every %{variable} match senren.en.yml;
# test/i18n_catalog_test.rb fails if they stop matching.
#
# Copy this file to config/locales/ (bin/rails senren:locales vi), then change any
# wording you like - it is your file. A key you delete falls back to the English.
