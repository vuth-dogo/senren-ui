AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# `%{name}` is I18n's interpolation syntax, and every translatable string in the
# components uses it. In aggressive mode this cop reads any string containing it
# as a malformed format string. Conservative mode checks only what is actually
# handed to format, sprintf, printf or `%`, which is the case it exists for.
Style/FormatStringToken:
  Mode: conservative

Naming/PredicateMethod:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - 'templates/components/**/*_component.rb'

Metrics/AbcSize:
  Max: 65

Metrics/ClassLength:
  Max: 150
  Exclude:
    # A test class is a list of independent cases, not a cohesive unit; its
    # length says nothing about its complexity.
    - 'test/**/*_test.rb'

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Max: 40

Metrics/ParameterLists:
  Exclude:
    - 'templates/components/**/*_component.rb'

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - 'lib/tasks/*.rake'
    - 'senren-ui.gemspec'
    - 'test/**/*_test.rb'

Lint/MissingSuper:
  Exclude:
    - 'templates/components/**/*_component.rb'

Style/OneClassPerFile:
  Exclude:
    - 'bin/*.rb'

# The gem is published as "senren-ui", and Bundler's default require target is
# the gem name verbatim. The hyphen is required for `gem "senren-ui"` with no
# require: option to work at all.
Naming/FileName:
  Exclude:
    - 'lib/senren-ui.rb'
